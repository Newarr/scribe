name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Needs macOS 26 host: Xcode 26's `actool` invokes AVFCore-backed
    # `ibtoold` for `.icon` asset compilation, which dyld-fails on macOS 15
    # because of missing CoreMedia symbols (e.g. `_kFigCaptionRegionDisplayAlign_Before`).
    # `swift build` and `swift test` worked on `macos-15` once xcode-select
    # pointed at Xcode 26.3, but the app's asset catalog needs the OS frameworks.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Build core
        run: swift build --build-tests --enable-code-coverage --force-resolved-versions
      - name: Build app
        run: |
          mkdir -p TranscriberApp/Scribe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved TranscriberApp/Scribe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild \
            -project TranscriberApp/Scribe.xcodeproj \
            -scheme Scribe \
            -onlyUsePackageVersionsFromResolvedFile \
            -configuration Debug \
            -derivedDataPath build/ci \
            -destination 'platform=macOS' \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Prepare MLX test runtime
        run: |
          test_binary_dir="$(swift build --show-bin-path)/TranscriberCorePackageTests.xctest/Contents/MacOS"
          cp build/ci/Build/Products/Debug/Scribe.app/Contents/Resources/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib "$test_binary_dir/mlx.metallib"
      - name: Test core
        run: swift test --skip-build --enable-code-coverage
